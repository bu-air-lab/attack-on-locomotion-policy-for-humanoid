seed: 42
device: cuda:0
num_steps_per_env: 24
max_iterations: 30000
empirical_normalization: false
policy:
  class_name: StudentTeacher
  init_noise_std: 1.0
  noise_std_type: scalar
  student_hidden_dims:
  - 512
  - 256
  - 128
  teacher_hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
algorithm:
  class_name: Distillation
  num_learning_epochs: 5
  learning_rate: 0.001
  gradient_length: 10
  max_grad_norm: 1.0
clip_actions: null
save_interval: 100
experiment_name: unitree_g1_23dof_student
run_name: ''
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: true
load_run: 25-student-attacked-with-angle
load_checkpoint: model_10300.pt
